security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\AdminUser:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin_users:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: admin_users
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                # Only ever return to an internal route name, never a raw URL.
                default_target_path: app_admin_telemetry
                enable_csrf: true
                csrf_token_id: authenticate
            logout:
                path: app_admin_logout
                target: app_admin_login
            # No remember-me and no other entry point: an anonymous request for
            # /admin/telemetry must land on the login prompt.
            entry_point: form_login

    # Note: Only the *first* matching rule is applied
    access_control:
        # Public marketing surface. The funnel POST carries its own CSRF token
        # and rate limit, so it stays anonymous by design.
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/training, roles: PUBLIC_ACCESS }
        - { path: ^/funnel, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/build, roles: PUBLIC_ACCESS }
        - { path: ^/favicon, roles: PUBLIC_ACCESS }

        # The command centre requires the explicit GDC administrator role.
        # Listed before the /admin catch-all so it always wins.
        - { path: ^/admin/telemetry, roles: ROLE_GDC_ADMIN }
        - { path: ^/admin, roles: ROLE_GDC_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\AdminUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
